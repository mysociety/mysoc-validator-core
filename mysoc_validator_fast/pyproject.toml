[build-system]
requires = ["maturin>=1.16,<1.17"]
build-backend = "maturin"

[project]
name = "mysoc-validator-fast"
version = "0.2.1"
description = "Fast, Rust-backed Popolo data for Python — drop-in replacement for mysoc_validator"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "requests", "rich>=10,<14", "typer>=0.12", "typing-extensions>=4.16"]

[project.scripts]
mysoc-validator = "mysoc_validator_fast.__main__:app"
msv = "mysoc_validator_fast.__main__:app"
mysoc-validator-fast = "mysoc_validator_fast.__main__:app"
msv-fast = "mysoc_validator_fast.__main__:app"

[tool.maturin]
python-source = "python"
module-name = "mysoc_validator_fast._mysoc_validator_fast"
features = ["pyo3/extension-module"]
