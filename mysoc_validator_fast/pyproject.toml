[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "mysoc-validator-fast"
version = "0.1.0"
description = "Fast, Rust-backed Popolo data for Python — drop-in replacement for mysoc_validator"
requires-python = ">=3.9"
dependencies = ["requests"]

[tool.maturin]
python-source = "python"
module-name = "mysoc_validator_fast._mysoc_validator_fast"
features = ["pyo3/extension-module"]
