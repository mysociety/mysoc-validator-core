[package]
name = "mysoc_validator_fast"
version = "0.2.1"
edition = "2021"

[lib]
name = "_mysoc_validator_fast"
crate-type = ["cdylib", "rlib"]

[dependencies]
popolo_validator = { path = "../popolo_validator" }
regmem_validator = { path = "../regmem_validator" }
transcript_validator = { path = "../transcript_validator" }
rust_decimal = "1"
fuzzy_date = { path = "../fuzzy_date", features = ["python"] }
pyo3 = { version = "0.30.1", features = ["abi3-py311", "multiple-pymethods", "experimental-inspect"] }
paste = "1"
serde_json = "1.0.118"
chrono = "0.4.38"
regex = "1.11.0"
