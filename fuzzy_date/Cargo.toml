[package]
name = "fuzzy_date"
version = "0.1.0"
edition = "2021"

[features]
python = ["dep:pyo3"]

[dependencies]
chrono = "0.4.38"
serde = "1.0.203"
serde_derive = "1.0.203"
pyo3 = { version = "0.30.1", features = ["chrono"], optional = true }

[lib]
crate-type = ["rlib"]

[profile.release]
lto = true
opt-level = 3
