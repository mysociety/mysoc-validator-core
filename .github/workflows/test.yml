name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Test Rust workspace
        run: cargo test --workspace --exclude mysoc_validator_fast --locked
      - name: Check Python extension
        run: cargo check -p mysoc_validator_fast --locked
      - name: Check formatting
        run: cargo fmt --all --check

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build test wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          maturin-version: v1.16.0
          target: x86_64
          manylinux: "2_28"
          args: >-
            --release --locked --compatibility pypi --out dist
            --manifest-path mysoc_validator_fast/Cargo.toml
      - name: Install wheel and test dependencies
        run: python -m pip install --find-links dist mysoc-validator-fast pytest
      - name: Test Python package
        run: python -m pytest mysoc_validator_fast/tests -q
      - name: Check generated stubs and type contracts
        if: matrix.python-version == '3.11'
        run: |
          python -m pip install maturin==1.16.0 mypy==2.4.1
          maturin generate-stubs --locked --manifest-path mysoc_validator_fast/Cargo.toml --out generated-stubs
          diff -u mysoc_validator_fast/python/mysoc_validator_fast/_mysoc_validator_fast.pyi generated-stubs/mysoc_validator_fast/_mysoc_validator_fast.pyi
          python -m mypy --strict --follow-imports=silent --python-version 3.11 -m mysoc_validator_fast._mysoc_validator_fast
          python -m mypy --strict --follow-imports=silent --python-version 3.11 mysoc_validator_fast/typecheck/contracts.py
