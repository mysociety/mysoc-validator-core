name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Plan release from the crate version
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("mysoc_validator_fast/Cargo.toml").read_text())["package"]["version"])')
          tag="v$version"
          git check-ref-format "refs/tags/$tag"
          build=false
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/$tag" ]]; then
              echo "Tag $GITHUB_REF does not match the canonical version $tag" >&2
              exit 1
            fi
            build=true
            publish=true
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git show-ref --verify --quiet "refs/tags/$tag"; then
            build=true
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            build=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release $tag: build=$build publish=$publish"

  tests:
    needs: [version]
    if: needs.version.outputs.build == 'true'
    uses: ./.github/workflows/test.yml

  wheels:
    needs: [tests]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: ubuntu-latest, target: x86_64, manylinux: "2_28", artifact: manylinux-x86_64}
          - {runner: ubuntu-latest, target: aarch64, manylinux: "2_28", artifact: manylinux-aarch64}
          - {runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, artifact: musllinux-x86_64}
          - {runner: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2, artifact: musllinux-aarch64}
          - {runner: windows-latest, target: x64, manylinux: auto, artifact: windows-x64}
          - {runner: macos-15-intel, target: x86_64, manylinux: auto, artifact: macos-x86_64}
          - {runner: macos-14, target: aarch64, manylinux: auto, artifact: macos-aarch64}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          maturin-version: v1.16.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          sccache: true
          args: >-
            --release --locked --compatibility pypi --out dist
            --manifest-path mysoc_validator_fast/Cargo.toml
            --interpreter ${{ runner.os == 'Linux' && 'python3.11' || 'python' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: wheel-${{ matrix.platform.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      - name: Build source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1
        with:
          maturin-version: v1.16.0
          command: sdist
          args: --out dist --manifest-path mysoc_validator_fast/Cargo.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  smoke-test:
    needs: [wheels]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install and exercise wheel
        shell: bash
        run: |
          python -m pip install pydantic requests "rich<14" typer
          python -m pip install --no-index --no-deps --find-links dist mysoc-validator-fast
          python -c "import mysoc_validator_fast"
          mysoc-validator-fast --help

  tag:
    if: needs.version.outputs.publish == 'true'
    needs: [version, wheels, sdist, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 0
      - name: Ensure the release tag points to this commit
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/*:refs/tags/*"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$(git rev-parse HEAD)" ]]; then
              echo "Tag $RELEASE_TAG already points to a different commit" >&2
              exit 1
            fi
          else
            git tag "$RELEASE_TAG" HEAD
            git push origin "refs/tags/$RELEASE_TAG"
          fi

  release:
    needs: [tag]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          name: sdist
          path: dist
      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: dist/*
      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
