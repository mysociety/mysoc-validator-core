[package]
name = "regmem_validator"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.118"
chrono = { version = "0.4.38", features = ["serde"] }
rust_decimal = "1"
strum = { version = "0.28", features = ["derive"] }
serde_with = { version = "3", default-features = false, features = ["macros", "std"] }
